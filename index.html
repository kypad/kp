<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#f7f7f8">

<title>Shared Clipboard</title>


<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {

  --primary: #ff6b00;
  --primary-hover: #e95f00;
  --primary-soft: rgba(255, 107, 0, 0.10);

  --background: #f5f6f8;
  --surface: #ffffff;

  --text: #171717;
  --text-secondary: #6b7280;

  --border: #e5e7eb;

  --shadow-small:
    0 2px 8px rgba(0,0,0,.04);

  --shadow-medium:
    0 8px 25px rgba(0,0,0,.06);

  --shadow-large:
    0 20px 60px rgba(0,0,0,.09);

}


/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: var(--background);

  color: var(--text);

}


button,
input,
textarea {

  font-family: inherit;

}


/* =========================================================
   KEY SCREEN
========================================================= */

#keyScreen {

  position: relative;

  width: 100%;

  min-height: 100vh;
  min-height: 100dvh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 24px;

  overflow: hidden;

  background:

    radial-gradient(
      circle at 20% 20%,
      rgba(255,107,0,.08),
      transparent 30%
    ),

    radial-gradient(
      circle at 80% 80%,
      rgba(255,150,50,.06),
      transparent 35%
    ),

    #f7f7f8;

}


/* Background grid */

#keyScreen::before {

  content: "";

  position: absolute;

  inset: 0;

  background-image:

    linear-gradient(
      rgba(0,0,0,.025) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(0,0,0,.025) 1px,
      transparent 1px
    );

  background-size: 35px 35px;

  pointer-events: none;

}


/* =========================================================
   KEY CARD
========================================================= */

.key-card {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 460px;

  padding: 42px;

  background:
    rgba(255,255,255,.95);

  border:
    1px solid rgba(0,0,0,.06);

  border-radius: 18px;

  box-shadow:
    var(--shadow-large);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  animation:
    cardEnter .45s ease;

}


@keyframes cardEnter {

  from {

    opacity: 0;

    transform:
      translateY(12px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* Orange accent */

.key-card::before {

  content: "";

  display: block;

  width: 44px;

  height: 5px;

  margin-bottom: 25px;

  background:
    var(--primary);

  border-radius: 10px;

}


/* =========================================================
   KEY CARD TEXT
========================================================= */

.key-card h1 {

  margin:
    0 0 10px;

  font-size:
    clamp(24px, 4vw, 30px);

  font-weight: 700;

  letter-spacing: -.7px;

}


.key-card p {

  margin:
    0 0 28px;

  color:
    var(--text-secondary);

  font-size: 14px;

  line-height: 1.6;

}


/* =========================================================
   KEY INPUT ROW
========================================================= */

.key-input-row {

  width: 100%;

  display: flex;

  gap: 10px;

}


/* =========================================================
   KEY INPUT
========================================================= */

#keyInput {

  display: block;

  flex: 1;

  width: 100%;

  min-width: 0;

  height: 50px;

  min-height: 50px;

  padding:
    0 16px;

  border:
    1px solid #d9dce1;

  border-radius: 9px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size: 15px;

  line-height: normal;

  outline: none;

  appearance: none;

  -webkit-appearance: none;

  transition:

    border-color .2s ease,
    box-shadow .2s ease;

}


#keyInput::placeholder {

  color:
    #aaaeb5;

}


#keyInput:hover {

  border-color:
    #c5c8cd;

}


#keyInput:focus {

  border-color:
    var(--primary);

  box-shadow:

    0 0 0 4px
    var(--primary-soft);

}


/* =========================================================
   ENTER BUTTON
========================================================= */

#enterButton {

  flex-shrink: 0;

  height: 50px;

  min-height: 50px;

  padding:
    0 23px;

  border: none;

  border-radius: 9px;

  background:
    var(--primary);

  color:
    #ffffff;

  font-size: 14px;

  font-weight: 650;

  cursor: pointer;

  box-shadow:

    0 4px 12px
    rgba(255,107,0,.18);

  transition:

    transform .15s ease,
    background .15s ease,
    box-shadow .15s ease;

}


#enterButton:hover {

  background:
    var(--primary-hover);

  transform:
    translateY(-1px);

  box-shadow:

    0 6px 16px
    rgba(255,107,0,.23);

}


#enterButton:active {

  transform:
    translateY(0);

}


/* =========================================================
   PAD SCREEN
========================================================= */

#padScreen {

  display: none;

  width: 100%;

  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background:
    var(--background);

}


/* =========================================================
   TOP BAR
========================================================= */

#topBar {

  position: relative;

  z-index: 10;

  width: 100%;

  height: 76px;

  display: flex;

  align-items: center;

  padding:
    0 18px 0 8px;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid var(--border);

  box-shadow:

    0 1px 4px
    rgba(0,0,0,.025);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

}


/* =========================================================
   BACK BUTTON
========================================================= */

#backButton {

  flex-shrink: 0;

  width: 48px;

  height: 48px;

  display: flex;

  align-items: center;

  justify-content: center;

  margin-right: 8px;

  border: none;

  border-radius: 50%;

  background:
    transparent;

  color:
    #454545;

  font-size: 25px;

  cursor: pointer;

  transition:

    background .15s ease,
    transform .15s ease;

}


#backButton:hover {

  background:
    #f1f2f4;

  transform:
    translateX(-2px);

}


/* =========================================================
   KEY DISPLAY
========================================================= */

#keyDisplayArea {

  flex: 1;

  min-width: 0;

  padding:
    10px 14px;

}


.key-label {

  margin-bottom: 5px;

  color:
    var(--text-secondary);

  font-size: 11px;

  font-weight: 600;

  letter-spacing: .5px;

  text-transform:
    uppercase;

}


#padName {

  display: block;

  width: 100%;

  padding-bottom: 7px;

  overflow: hidden;

  border-bottom:
    2px solid var(--primary);

  color:
    #202020;

  font-size: 15px;

  font-weight: 550;

  white-space: nowrap;

  text-overflow: ellipsis;

}


/* =========================================================
   STATUS
========================================================= */

#status {

  flex-shrink: 0;

  min-width: 80px;

  margin:
    0 16px;

  padding:
    6px 10px;

  border-radius:
    20px;

  background:
    #f3f4f6;

  color:
    var(--text-secondary);

  font-size: 11px;

  font-weight: 600;

  text-align: center;

  transition:
    all .2s ease;

}


/* =========================================================
   UPDATE BUTTON
========================================================= */

#updateButton {

  flex-shrink: 0;

  height: 46px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 9px;

  padding:
    0 19px;

  border: none;

  border-radius: 8px;

  background:
    var(--primary);

  color:
    #ffffff;

  font-size: 14px;

  font-weight: 650;

  cursor: pointer;

  box-shadow:

    0 4px 12px
    rgba(255,107,0,.17);

  transition:

    background .15s ease,
    transform .15s ease,
    box-shadow .15s ease;

}


#updateButton:hover {

  background:
    var(--primary-hover);

  transform:
    translateY(-1px);

  box-shadow:

    0 6px 15px
    rgba(255,107,0,.22);

}


#updateButton:active {

  transform:
    translateY(0);

}


/* Update arrow */

.update-icon {

  width: 0;

  height: 0;

  border-top:
    7px solid transparent;

  border-bottom:
    7px solid transparent;

  border-left:
    16px solid #ffffff;

}


/* =========================================================
   EDITOR WORKSPACE
========================================================= */

#editorArea {

  width: 100%;

  height:
    calc(100vh - 76px);

  height:
    calc(100dvh - 76px);

  padding:

    clamp(16px, 3vw, 32px)

    clamp(12px, 4vw, 40px)

    50px;

  overflow: auto;

  background:

    linear-gradient(
      180deg,
      #f5f6f7,
      #f1f2f4
    );

  scrollbar-width:
    thin;

  scrollbar-color:
    #c8c8c8 transparent;

}


#editorArea::-webkit-scrollbar {

  width: 8px;

}


#editorArea::-webkit-scrollbar-track {

  background:
    transparent;

}


#editorArea::-webkit-scrollbar-thumb {

  background:
    #c8c8c8;

  border-radius:
    10px;

}


/* =========================================================
   PAPER
========================================================= */

#paper {

  width: 100%;

  max-width: 850px;

  min-height:
    calc(100vh - 140px);

  min-height:
    calc(100dvh - 140px);

  margin:
    0 auto;

  overflow: hidden;

  background:
    #ffffff;

  border:
    1px solid rgba(0,0,0,.06);

  border-radius:
    7px;

  box-shadow:
    var(--shadow-medium);

  transition:
    box-shadow .2s ease;

}


#paper:focus-within {

  box-shadow:

    0 12px 35px
    rgba(0,0,0,.08);

}


/* =========================================================
   TEXTAREA
========================================================= */

#pad {

  display: block;

  width: 100%;

  min-height:
    calc(100vh - 140px);

  min-height:
    calc(100dvh - 140px);

  padding:
    clamp(22px, 4vw, 40px);

  border: none;

  outline: none;

  resize: none;

  background:
    transparent;

  color:
    #202124;

  font-family:

    "SFMono-Regular",
    Consolas,
    "Liberation Mono",
    Menlo,
    monospace;

  font-size:
    clamp(14px, 1.3vw, 16px);

  line-height: 1.7;

  tab-size: 4;

  caret-color:
    var(--primary);

}


#pad::placeholder {

  color:
    #b0b3b8;

}


/* =========================================================
   TABLETS
========================================================= */

@media (max-width: 900px) {

  #editorArea {

    padding:
      20px 18px 35px;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {


  /* =====================
     LOGIN
  ===================== */

  #keyScreen {

    padding:
      18px;

  }


  .key-card {

    width: 100%;

    max-width: 100%;

    padding:
      34px 26px;

    border-radius:
      18px;

  }


  .key-card::before {

    width: 52px;

    height: 5px;

    margin-bottom:
      24px;

  }


  .key-card h1 {

    margin-bottom:
      12px;

    font-size:
      27px;

    line-height:
      1.2;

  }


  .key-card p {

    margin-bottom:
      27px;

    font-size:
      15px;

    line-height:
      1.6;

  }


  /* =====================
     INPUT LAYOUT
  ===================== */

  .key-input-row {

    width: 100%;

    display: flex;

    flex-direction:
      column;

    gap:
      13px;

  }


  /* =====================
     LARGE MOBILE INPUT
  ===================== */

  #keyInput {

    display: block;

    flex: none;

    width: 100% !important;

    min-width: 100%;

    height: 58px !important;

    min-height: 58px !important;

    max-height: 58px;

    padding:
      0 18px;

    border:
      1.5px solid #d7d9dd;

    border-radius:
      12px;

    background:
      #ffffff;

    font-size:
      16px;

    line-height:
      58px;

    appearance:
      none;

    -webkit-appearance:
      none;

  }


  #keyInput::placeholder {

    color:
      #a9adb3;

    font-size:
      16px;

  }


  #keyInput:focus {

    border-color:
      var(--primary);

    box-shadow:

      0 0 0 4px
      rgba(255,107,0,.10);

  }


  /* =====================
     ENTER BUTTON
  ===================== */

  #enterButton {

    display: block;

    width: 100%;

    height:
      58px;

    min-height:
      58px;

    padding:
      0 20px;

    border-radius:
      12px;

    font-size:
      16px;

    font-weight:
      650;

    box-shadow:

      0 6px 16px
      rgba(255,107,0,.20);

  }


  /* =====================
     TOP BAR
  ===================== */

  #topBar {

    height:
      68px;

    padding:
      0 8px 0 3px;

  }


  #backButton {

    width:
      42px;

    height:
      42px;

    margin-right:
      2px;

    font-size:
      23px;

  }


  #keyDisplayArea {

    padding:
      8px 7px;

  }


  .key-label {

    margin-bottom:
      3px;

    font-size:
      9px;

  }


  #padName {

    padding-bottom:
      5px;

    font-size:
      13px;

  }


  /* Hide status on small screen */

  #status {

    display:
      none;

  }


  /* =====================
     UPDATE BUTTON
  ===================== */

  #updateButton {

    height:
      42px;

    padding:
      0 13px;

    margin-left:
      7px;

    border-radius:
      7px;

    font-size:
      13px;

  }


  .update-icon {

    border-top-width:
      6px;

    border-bottom-width:
      6px;

    border-left-width:
      13px;

  }


  /* =====================
     EDITOR
  ===================== */

  #editorArea {

    height:
      calc(100vh - 68px);

    height:
      calc(100dvh - 68px);

    padding:
      10px;

  }


  #paper {

    min-height:
      calc(100vh - 88px);

    min-height:
      calc(100dvh - 88px);

    border-radius:
      6px;

    box-shadow:

      0 2px 8px
      rgba(0,0,0,.05);

  }


  #pad {

    min-height:
      calc(100vh - 88px);

    min-height:
      calc(100dvh - 88px);

    padding:
      20px 17px;

    font-size:
      14px;

    line-height:
      1.65;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

  #keyScreen {

    padding:
      12px;

  }


  .key-card {

    padding:
      28px 20px;

  }


  .key-card h1 {

    font-size:
      24px;

  }


  #topBar {

    padding-right:
      5px;

  }


  #backButton {

    width:
      38px;

  }


  #updateButton {

    padding:
      0 10px;

    gap:
      6px;

    font-size:
      12px;

  }


  #pad {

    padding:
      17px 14px;

  }

}


/* =========================================================
   LARGE DESKTOP / 2K / 4K
========================================================= */

@media (min-width: 1600px) {

  #paper {

    max-width:
      950px;

  }


  #pad {

    font-size:
      16px;

  }


  .key-card {

    max-width:
      490px;

  }

}


/* =========================================================
   LANDSCAPE PHONES
========================================================= */

@media
(max-height: 500px)
and
(orientation: landscape) {

  #keyScreen {

    align-items:
      flex-start;

    overflow-y:
      auto;

    padding-top:
      25px;

    padding-bottom:
      25px;

  }


  .key-card {

    padding:
      24px;

  }


  .key-card::before {

    margin-bottom:
      14px;

  }


  .key-card p {

    margin-bottom:
      15px;

  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     SCREEN 1
====================================================== -->

<div id="keyScreen">

  <div class="key-card">


    <h1>
      Shared Clipboard
    </h1>


    <p>
      Enter your unique room key to open your shared clipboard.
    </p>


    <div class="key-input-row">


      <input
        id="keyInput"
        type="text"
        placeholder="Enter unique key"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      >


      <button
        id="enterButton"
        type="button"
      >
        Enter
      </button>


    </div>

  </div>

</div>



<!-- =====================================================
     SCREEN 2
====================================================== -->

<div id="padScreen">


  <!-- HEADER -->

  <div id="topBar">


    <button
      id="backButton"
      type="button"
      aria-label="Go back"
      title="Back"
    >
      ←
    </button>


    <div id="keyDisplayArea">


      <div class="key-label">
        Key
      </div>


      <span id="padName"></span>


    </div>


    <span id="status">
      idle
    </span>


    <button
      id="updateButton"
      type="button"
    >


      <span class="update-icon"></span>


      <span>
        Update
      </span>


    </button>


  </div>



  <!-- EDITOR -->

  <div id="editorArea">


    <div id="paper">


      <textarea
        id="pad"
        spellcheck="false"
        placeholder="Start typing..."
      ></textarea>


    </div>


  </div>


</div>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let ws;

let room;

let suppress = false;


/* =========================================================
   ELEMENTS
========================================================= */

const keyInput =
  document.getElementById("keyInput");


const keyScreen =
  document.getElementById("keyScreen");


const padScreen =
  document.getElementById("padScreen");


const pad =
  document.getElementById("pad");


const status =
  document.getElementById("status");


const padName =
  document.getElementById("padName");


const enterButton =
  document.getElementById("enterButton");


const updateButton =
  document.getElementById("updateButton");


const backButton =
  document.getElementById("backButton");



/* =========================================================
   OPEN PAD
========================================================= */

async function openPad() {


  room =
    keyInput.value.trim();


  if (!room) {

    keyInput.focus();

    return;

  }


  /* Switch screens */

  keyScreen.style.display =
    "none";


  padScreen.style.display =
    "block";


  /* Display key */

  padName.textContent =
    room;


  status.textContent =
    "loading...";


  /* =====================================================
     LOAD SAVED CONTENT
     CLOUDFLARE ENDPOINT UNCHANGED
  ===================================================== */

  try {


    const res =
      await fetch(

        `https://chat-server.skybaseofj2.workers.dev/history?room=${encodeURIComponent(room)}`

      );


    const history =
      await res.json();


    pad.value =

      history.length

        ? (
            history[
              history.length - 1
            ].text || ""
          )

        : "";


  }

  catch (error) {


    pad.value = "";


  }



  /* =====================================================
     WEBSOCKET
     ENDPOINT UNCHANGED
  ===================================================== */

  ws =
    new WebSocket(

      `wss://chat-server.skybaseofj2.workers.dev/?room=${encodeURIComponent(room)}`

    );



  ws.onopen =
    () => {


      status.textContent =
        "ready";


    };



  ws.onmessage =
    e => {


      try {


        const m =
          JSON.parse(e.data);


        if (
          typeof m.text !== "string"
        ) {

          return;

        }


        suppress =
          true;


        pad.value =
          m.text;


        status.textContent =
          "saved";


      }

      catch (error) {

        console.error(
          "Invalid WebSocket message:",
          error
        );

      }


    };



  ws.onerror =
    () => {


      status.textContent =
        "connection error";


    };



  ws.onclose =
    () => {


      status.textContent =
        "disconnected";


    };


  pad.focus();


}



/* =========================================================
   ENTER BUTTON
========================================================= */

enterButton.addEventListener(

  "click",

  openPad

);



/* =========================================================
   PRESS ENTER TO OPEN
========================================================= */

keyInput.addEventListener(

  "keydown",

  e => {


    if (
      e.key === "Enter"
    ) {


      e.preventDefault();


      openPad();


    }


  }

);



/* =========================================================
   DETECT CHANGES
========================================================= */

pad.addEventListener(

  "input",

  () => {


    if (suppress) {


      suppress =
        false;


      return;


    }


    status.textContent =
      "unsaved";


  }

);



/* =========================================================
   UPDATE / SAVE
========================================================= */

updateButton.addEventListener(

  "click",

  () => {


    if (
      !ws ||
      ws.readyState !== WebSocket.OPEN
    ) {


      status.textContent =
        "not connected";


      return;


    }


    status.textContent =
      "saving...";


    /* Backend message format unchanged */

    ws.send(

      JSON.stringify({

        user:
          "__pad__",

        text:
          pad.value,

        time:
          Date.now()

      })

    );


    status.textContent =
      "saved";


  }

);



/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(

  "click",

  () => {


    if (ws) {


      ws.close();


      ws =
        null;


    }


    padScreen.style.display =
      "none";


    keyScreen.style.display =
      "flex";


    status.textContent =
      "idle";


    keyInput.focus();


  }

);

</script>


</body>
</html>
